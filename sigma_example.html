<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/public/simple.css">
    <meta charset="UTF-8" />
    <title>Telegram graph visualization</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon/favicon-16x16.png">
    <link rel="manifest" href="/public/favicon/site.webmanifest">
  </head>
  <body>
    <h1>🌌 Telegram graph visualization</h1>
    <p>The evolution of Scandinavian telegram channels over time. <br>
      <ul>
      <li>342 nodes</li>
      <li>14725 edges</li>
    </ul>
    </p>
    <div id="container" style="width: 800px; height: 600px; background: #ffffff00"></div>
    <div style="margin: 10px 0;">
        <button id="pause-play-btn" style="font-size: 16px; padding: 10px 20px; cursor: pointer;">Pause</button>
        <button id="restart-btn" style="font-size: 16px; padding: 10px 20px; cursor: pointer;">Restart</button>
    </div>
    <p>Current time: <span id="current_time" style="font-size: 16pt; font-family: sans-serif;"> </span></p>
    <p>
        <span class="dot" style="background-color: #BA0C2F"></span>Norway<br>
        <span class="dot" style="background-color: rgb(50, 204, 255)"></span>Finland<br>
        <span class="dot" style="background-color: #FFCD00"></span>Sweden<br>
        <span class="dot" style="background-color: rgb(244, 142, 59)"></span>Denmark<br>
    </p>
    <script src="/build/bundle.js"></script>
  </body>
</html>
